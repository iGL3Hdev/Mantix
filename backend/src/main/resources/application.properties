spring.application.name=mantix-backend

# Flyway es el dueño del esquema; Hibernate solo cmprueba que las entidades encajan con él.
spring.jpa.hibernate.ddl-auto=validate

# Evita consultas a la base de datos durante el renderizado d ela respuesta
spring.jpa.open-in-view=false

# Las fechas se guardan y se leen en UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# Conexión a MySQL. Cada valor se puede sustituir con una variable de entorno; los de por defecto sirven para desarrollo local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mantix}
spring.datasource.username=${DB_USER:mantix}
spring.datasource.password=${DB_PASSWORD:mantix}
