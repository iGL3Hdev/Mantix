spring.application.name=mantix-backend

# Flyway es el dueño del esquema; Hibernate solo cmprueba que las entidades encajan con él.
spring.jpa.hibernate.ddl-auto=validate

# Evita consultas a la base de datos durante el renderizado d ela respuesta
spring.jpa.open-in-view=false

# Las fechas se guardan y se leen en UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
